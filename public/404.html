<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <script>
      // GitHub Pages SPA redirect
      var path = window.location.pathname;
      if (path !== '/' && path !== '/index.html') {
        sessionStorage.setItem('spa-redirect', path);
        window.location.replace('/');
      }
    </script>
  </head>
</html>
